name: Build & Release .wz

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.6)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build .wz package
        run: |
          # A .wz is just a .zip containing ONLY the mod itself:
          #   diffs/     - the stats that get merged onto the base game
          #   components/weapons, structs, effects - .pie models the game loads
          # Everything else in the repo is developer tooling and is deliberately
          # NOT shipped: check.py, AGENTS.md, README.md, WISHLIST.md,
          # stats-reference.md, Pictures/, .github/.
          # If a texpages/ directory is ever added it must be listed here too.
          zip -r MoreFortress-${{ github.event.inputs.tag || github.ref_name }}.wz \
            diffs components structs effects \
            -x '*.git*'

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: MoreFortress-*.wz
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
